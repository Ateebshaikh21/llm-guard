name: LLM-Guard CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Unit + integration tests ───────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Install ML service dependencies
        run: pip install -r ai/adversarial_scanner/requirements_ml.txt

      - name: Run unit & integration tests
        env:
          # Minimal environment — no real DB/Redis needed for unit tests
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: ""
          JWT_SECRET_KEY: "ci_test_secret_key_this_is_long_enough_for_tests_32chars"
          ENVIRONMENT: "development"
          CORS_ORIGINS: '["http://localhost:5173"]'
          ALLOW_INSECURE_TLS: "false"
        run: python -m pytest tests/ -v --tb=short

  # ── ML evaluation quality gate ─────────────────────────────────────
  ml-evaluation:
    name: ML Evaluation Gate
    runs-on: ubuntu-latest
    needs: test   # Only run evaluation if unit tests pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ML dependencies
        run: pip install -r ai/adversarial_scanner/requirements_ml.txt

      - name: Run ML evaluation (gate on >=95% precision AND recall)
        run: python ai/adversarial_scanner/evaluate_model.py --save-on-pass
        working-directory: .

      - name: Upload model metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-metadata
          path: ai/adversarial_scanner/model/metadata.json
          retention-days: 30

      - name: Upload failed evaluation artifact (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-eval-model
          path: |
            ai/adversarial_scanner/model/classifier_failed_eval.pkl
            ai/adversarial_scanner/model/failed_eval_metrics.json
          retention-days: 7

  # ── Frontend build check ───────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
